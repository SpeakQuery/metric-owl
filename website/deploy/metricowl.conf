# Public marketing and documentation only. Each customer's dashboard runs on
# their own server, independently of this website.
server {
    listen 80;
    listen [::]:80;
    server_name metricowl.cloud www.metricowl.cloud;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/metricowl/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://metricowl.cloud$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.metricowl.cloud;
    ssl_certificate /etc/letsencrypt/live/metricowl.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metricowl.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://metricowl.cloud$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metricowl.cloud;
    ssl_certificate /etc/letsencrypt/live/metricowl.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metricowl.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MetricOwlTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /var/www/metricowl/current;
    index index.html;
    server_tokens off;
    autoindex off;
    access_log /var/log/nginx/metricowl-access.log;
    error_log /var/log/nginx/metricowl-error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/(admin|api)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
}
