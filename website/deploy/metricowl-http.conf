# Bootstrap only: HTTP-01 validation without changing any existing site.
server {
    listen 80;
    listen [::]:80;
    server_name metricowl.cloud www.metricowl.cloud;
    root /var/www/metricowl/current;
    index index.html;
    access_log /var/log/nginx/metricowl-access.log;
    error_log /var/log/nginx/metricowl-error.log warn;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/metricowl/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ (^|/)\. { return 404; }
    location ~ ^/(admin|api)(/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
