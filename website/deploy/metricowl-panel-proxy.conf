# Install as /etc/nginx/snippets/metricowl-panel-proxy.conf after configuring
# GUARD_PUBLIC_ORIGIN=https://metricowl.cloud and GUARD_PROXY_TOKEN_FILE.
proxy_pass http://127.0.0.1:4877;
proxy_http_version 1.1;
proxy_set_header Host metricowl.cloud;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-For "";
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
include /etc/nginx/snippets/metricowl-proxy-token.conf;
proxy_connect_timeout 5s;
proxy_read_timeout 65s;
proxy_send_timeout 30s;
proxy_buffering off;
proxy_cache off;
proxy_redirect off;
client_max_body_size 64k;
client_body_timeout 15s;
limit_req zone=metricowl_auth burst=5 nodelay;
limit_req_status 429;
limit_conn metricowl_panel_connections 30;
limit_conn_status 429;
add_header Strict-Transport-Security "max-age=31536000" always;
# Declaring headers here prevents inheriting the static site's form/style CSP.
# Axum supplies the panel CSP, no-store, frame and content-type protections.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
