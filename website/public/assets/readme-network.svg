<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="718" viewBox="0 0 1200 718" role="img" aria-labelledby="title desc">
<title id="title">Network boundaries for a self-hosted Metric Owl installation</title><desc id="desc">A browser uses HTTPS on the selected public panel port 8443, 9443 or 10443. The proxy forwards to the local application at 127.0.0.1:4877. Optional MCP uses SSH stdio on the server’s SSH port. Optional outbound AI and SMTP connections use the providers configured by the owner. Inbound TCP80 is used for IP certificate validation and renewal. No central Metric Owl service receives monitoring data.</desc>
<defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#79dfc5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="peach-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#f0ba96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a7c9e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a8bac1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="lilac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#c5bfdf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="hero-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162a30"/><stop offset="1" stop-color="#0c171b"/></linearGradient></defs>
<g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="1198" height="716" rx="24" fill="#0d171c" stroke="#30454e" />
<rect x="40" y="32" width="46" height="32" rx="16" fill="#0d171c" stroke="#79dfc5" /><text x="63.0" y="53" fill="#79dfc5" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">04</text><text x="102" y="54" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">NETWORK / CONNECTIONS</text><text x="40" y="105" fill="#eff5f3" font-size="34" font-weight="600" text-anchor="start" >A small, explicit connection map.</text><text x="40" y="139" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >The product website is separate. Your own IP address opens your own control center.</text><rect x="361" y="174" width="470" height="461" rx="20" fill="#101e24" stroke="#30454e" /><text x="387" y="207" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">YOUR SERVER</text><rect x="40" y="244" width="258" height="102" rx="18" fill="#15242b" stroke="#30454e" /><path d="M41 266V324" fill="none" stroke="#a7c9e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="280" fill="#a7c9e1" font-size="22" font-weight="600" text-anchor="start" >Browser</text><text x="62" y="311" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >HTTPS · selected panel port</text><rect x="397" y="244" width="398" height="102" rx="18" fill="#15242b" stroke="#30454e" /><path d="M398 266V324" fill="none" stroke="#a7c9e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="419" y="280" fill="#a7c9e1" font-size="22" font-weight="600" text-anchor="start" >HTTPS proxy</text><text x="419" y="311" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >8443 → 9443 → 10443 fallback</text><path d="M298 293H389" fill="none" stroke="#a7c9e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><path d="M596 346V386" fill="none" stroke="#a7c9e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><text x="614" y="373" fill="#a7c9e1" font-size="12" font-weight="600" text-anchor="start" >LOOPBACK ONLY</text><rect x="397" y="398" width="398" height="115" rx="18" fill="#15242b" stroke="#30454e" /><path d="M398 420V491" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="419" y="434" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >Metric Owl</text><text x="419" y="465" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >127.0.0.1:4877</text><text x="419" y="490" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Local data + administrator account</text><rect x="40" y="398" width="258" height="115" rx="18" fill="#15242b" stroke="#30454e" /><path d="M41 420V491" fill="none" stroke="#c5bfdf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="434" fill="#c5bfdf" font-size="22" font-weight="600" text-anchor="start" >MCP client</text><text x="62" y="465" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >SSH stdio · your SSH port</text><text x="62" y="490" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Optional scoped read access</text><path d="M298 456H389" fill="none" stroke="#c5bfdf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lilac-arrow)" stroke-dasharray="7 7"/><rect x="894" y="223" width="266" height="112" rx="18" fill="#15242b" stroke="#30454e" /><path d="M895 245V313" fill="none" stroke="#f0ba96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="916" y="259" fill="#f0ba96" font-size="22" font-weight="600" text-anchor="start" >AI provider</text><text x="916" y="290" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Your API key</text><text x="916" y="315" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Bounded analysis evidence</text><rect x="894" y="398" width="266" height="112" rx="18" fill="#15242b" stroke="#30454e" /><path d="M895 420V488" fill="none" stroke="#f0ba96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="916" y="434" fill="#f0ba96" font-size="22" font-weight="600" text-anchor="start" >SMTP provider</text><text x="916" y="465" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Your email account</text><text x="916" y="490" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Selected alerts and reports</text><path d="M795 429H852V280H886" fill="none" stroke="#f0ba96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#peach-arrow)" stroke-dasharray="7 7"/><path d="M795 477H886" fill="none" stroke="#f0ba96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#peach-arrow)" stroke-dasharray="7 7"/><rect x="397" y="549" width="398" height="61" rx="18" fill="#15242b" stroke="#30454e" /><path d="M398 571V588" fill="none" stroke="#a8bac1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="419" y="585" fill="#a8bac1" font-size="22" font-weight="600" text-anchor="start" >IP certificate renewal</text><text x="40" y="576" fill="#a8bac1" font-size="20" font-weight="600" text-anchor="start" >Certificate authority</text><text x="40" y="606" fill="#a8bac1" font-size="17" font-weight="400" text-anchor="start" >Inbound TCP 80 validation</text><path d="M298 579H389" fill="none" stroke="#a8bac1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#muted-arrow)"/><text x="894" y="569" fill="#f0ba96" font-size="17" font-weight="600" text-anchor="start" >Outbound integrations</text><text x="894" y="597" fill="#a8bac1" font-size="16" font-weight="400" text-anchor="start" >Enabled only when configured.</text><text x="40" y="683" fill="#a8bac1" font-size="21" font-weight="400" text-anchor="start" >No central Metric Owl service receives your monitoring data.</text>
</g></svg>
