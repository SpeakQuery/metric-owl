<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="607" viewBox="0 0 1200 607" role="img" aria-labelledby="title desc">
<title id="title">Read-only MCP question and answer flow</title><desc id="desc">A user asks an AI assistant when CPU and memory rose together. The assistant requests permitted tools through local or SSH stdio. The scoped Metric Owl MCP bridge reads local metrics, history, incidents and configured log summaries and returns context. The assistant reasons about the data; MCP cannot run commands or change the server.</desc>
<defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#79dfc5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="peach-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#f0ba96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a7c9e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a8bac1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="lilac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#c5bfdf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="hero-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162a30"/><stop offset="1" stop-color="#0c171b"/></linearGradient></defs>
<g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="1198" height="605" rx="24" fill="#0d171c" stroke="#30454e" />
<rect x="40" y="32" width="46" height="32" rx="16" fill="#0d171c" stroke="#79dfc5" /><text x="63.0" y="53" fill="#79dfc5" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">03</text><text x="102" y="54" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">MCP / CONVERSATION</text><text x="40" y="105" fill="#eff5f3" font-size="34" font-weight="600" text-anchor="start" >Ask a question. Get the collected context.</text><text x="40" y="139" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Your assistant interprets the answer; MCP supplies scoped, read-only access to recorded evidence.</text><rect x="40" y="178" width="1120" height="77" rx="14" fill="#1a282e" stroke="#30454e" /><text x="65" y="225" fill="#eff5f3" font-size="29" font-weight="500" text-anchor="start" >“When did CPU and memory rise together?”</text><rect x="40" y="306" width="253" height="128" rx="18" fill="#15242b" stroke="#30454e" /><path d="M41 328V412" fill="none" stroke="#f0ba96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="342" fill="#f0ba96" font-size="22" font-weight="600" text-anchor="start" >Your AI assistant</text><text x="62" y="373" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Codex or an MCP client</text><text x="62" y="398" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Chooses a permitted tool</text><rect x="380" y="306" width="388" height="128" rx="18" fill="#15242b" stroke="#30454e" /><path d="M381 328V412" fill="none" stroke="#a7c9e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="402" y="342" fill="#a7c9e1" font-size="22" font-weight="600" text-anchor="start" >Metric Owl MCP bridge</text><text x="402" y="373" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Local or SSH stdio → private IPC</text><text x="402" y="398" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Per-client scopes · revocable keys</text><rect x="855" y="306" width="305" height="128" rx="18" fill="#15242b" stroke="#30454e" /><path d="M856 328V412" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="877" y="342" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >Local evidence</text><text x="877" y="373" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Metrics · history · incidents</text><text x="877" y="398" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Configured log summaries</text><path d="M293 343H372" fill="none" stroke="#a7c9e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><text x="334" y="323" fill="#a7c9e1" font-size="12" font-weight="600" text-anchor="middle" >REQUEST</text><path d="M768 343H847" fill="none" stroke="#a7c9e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><text x="811" y="323" fill="#a7c9e1" font-size="12" font-weight="600" text-anchor="middle" >READ</text><path d="M855 399H776" fill="none" stroke="#79dfc5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M380 399H301" fill="none" stroke="#79dfc5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="811" y="425" fill="#79dfc5" font-size="12" font-weight="600" text-anchor="middle" >RESULT</text><text x="334" y="425" fill="#79dfc5" font-size="12" font-weight="600" text-anchor="middle" >CONTEXT</text><path d="M165 436V493H1159" fill="none" stroke="#f0ba96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="165" cy="493" r="4" fill="#f0ba96"/><text x="40" y="542" fill="#a8bac1" font-size="20" font-weight="400" text-anchor="start" >MCP does not reason by itself. The client explains the returned data.</text><text x="40" y="574" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >No shell commands, arbitrary file reads, SQL execution or server changes.</text>
</g></svg>
