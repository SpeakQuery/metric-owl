<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Metric Owl self-hosted system architecture</title><desc id="desc">A browser connects over HTTPS to Metric Owl on your server. Local system signals feed the Rust agent; local rules detect incidents, and SQLite stores history. The administrator account remains on your server.</desc>
<defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#79dfc5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="peach-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#f0ba96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a7c9e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a8bac1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="lilac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#c5bfdf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="hero-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162a30"/><stop offset="1" stop-color="#0c171b"/></linearGradient></defs>
<g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="1198" height="598" rx="24" fill="#0d171c" stroke="#30454e" />
<rect x="40" y="32" width="46" height="32" rx="16" fill="#0d171c" stroke="#79dfc5" /><text x="63.0" y="53" fill="#79dfc5" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">01</text><text x="102" y="54" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">SYSTEM / OWNERSHIP</text><text x="40" y="105" fill="#eff5f3" font-size="34" font-weight="600" text-anchor="start" >Your server is the home base.</text><text x="40" y="139" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >The application, account and collected history live together on the machine you monitor.</text><rect x="283" y="170" width="877" height="365" rx="20" fill="#101e24" stroke="#30454e" /><text x="309" y="201" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">YOUR OWN SERVER</text><rect x="40" y="313" width="204" height="118" rx="18" fill="#15242b" stroke="#30454e" /><path d="M41 335V409" fill="none" stroke="#a7c9e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="349" fill="#a7c9e1" font-size="22" font-weight="600" text-anchor="start" >Your browser</text><text x="62" y="380" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Computer or phone</text><text x="62" y="405" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >No agent needed</text><path d="M244 372H313" fill="none" stroke="#a7c9e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><text x="277" y="354" fill="#a7c9e1" font-size="13" font-weight="600" text-anchor="middle" >HTTPS</text><rect x="320" y="231" width="340" height="91" rx="18" fill="#15242b" stroke="#30454e" /><path d="M321 253V300" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="342" y="267" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >System signals</text><text x="342" y="298" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >CPU · RAM · disks · logs</text><path d="M490 323V361" fill="none" stroke="#79dfc5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><rect x="320" y="374" width="340" height="126" rx="18" fill="#15242b" stroke="#30454e" /><path d="M321 396V478" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="342" y="410" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >Metric Owl</text><text x="342" y="441" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Rust agent + web dashboard</text><text x="342" y="466" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Your administrator account</text><rect x="748" y="231" width="373" height="117" rx="18" fill="#15242b" stroke="#30454e" /><path d="M749 253V326" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="770" y="267" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >Local rules</text><text x="770" y="298" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Thresholds · time windows</text><text x="770" y="323" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Incidents without an AI request</text><rect x="748" y="384" width="373" height="117" rx="18" fill="#15242b" stroke="#30454e" /><path d="M749 406V479" fill="none" stroke="#a7c9e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="770" y="420" fill="#a7c9e1" font-size="22" font-weight="600" text-anchor="start" >SQLite history</text><text x="770" y="451" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Timestamped measurements</text><text x="770" y="476" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Local incident evidence</text><path d="M660 405H697V289H741" fill="none" stroke="#79dfc5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M660 462H741" fill="none" stroke="#a7c9e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue-arrow)"/><text x="40" y="570" fill="#a8bac1" font-size="20" font-weight="400" text-anchor="start" >No shared Metric Owl cloud account. No central monitoring service.</text>
</g></svg>
