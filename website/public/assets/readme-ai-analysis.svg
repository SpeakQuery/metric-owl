<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title desc">
<title id="title">Bounded incident analysis with optional AI</title><desc id="desc">Local rules detect issues without AI. Selected incident evidence is redacted and bounded before optional analysis using your provider and API key. Output distinguishes evidence, possible causes and suggested checks. Critical alerts do not wait for AI, and the model has no command execution or configuration privileges.</desc>
<defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#79dfc5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="peach-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#f0ba96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a7c9e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="muted-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#a8bac1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="lilac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#c5bfdf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><linearGradient id="hero-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162a30"/><stop offset="1" stop-color="#0c171b"/></linearGradient></defs>
<g font-family="'IBM Plex Sans', 'Segoe UI', sans-serif">
<rect x="1" y="1" width="1198" height="583" rx="24" fill="#0d171c" stroke="#30454e" />
<rect x="40" y="32" width="46" height="32" rx="16" fill="#0d171c" stroke="#79dfc5" /><text x="63.0" y="53" fill="#79dfc5" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">02</text><text x="102" y="54" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">ANALYSIS / EVIDENCE</text><text x="40" y="105" fill="#eff5f3" font-size="34" font-weight="600" text-anchor="start" >AI for the questions behind the alert.</text><text x="40" y="139" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Routine detection stays local. Optional analysis receives a bounded, sanitized evidence package.</text><text x="40" y="197" fill="#79dfc5" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">ALWAYS LOCAL</text><text x="652" y="197" fill="#f0ba96" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2.2">OPTIONAL · YOUR PROVIDER</text><rect x="40" y="229" width="245" height="145" rx="18" fill="#15242b" stroke="#30454e" /><path d="M41 251V352" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="265" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >01  Detect</text><text x="62" y="296" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Rules watch thresholds</text><text x="62" y="321" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >and time windows.</text><text x="62" y="346" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >No AI call needed.</text><path d="M285 300H321" fill="none" stroke="#79dfc5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><rect x="334" y="229" width="245" height="145" rx="18" fill="#15242b" stroke="#30454e" /><path d="M335 251V352" fill="none" stroke="#79dfc5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="356" y="265" fill="#79dfc5" font-size="22" font-weight="600" text-anchor="start" >02  Prepare</text><text x="356" y="296" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Collect selected metrics</text><text x="356" y="321" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >and incident context.</text><text x="356" y="346" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Redact and limit size.</text><path d="M579 300H636" fill="none" stroke="#f0ba96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#peach-arrow)" stroke-dasharray="7 7"/><rect x="649" y="229" width="245" height="145" rx="18" fill="#15242b" stroke="#30454e" /><path d="M650 251V352" fill="none" stroke="#f0ba96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="671" y="265" fill="#f0ba96" font-size="22" font-weight="600" text-anchor="start" >03  Analyze</text><text x="671" y="296" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Use your API key</text><text x="671" y="321" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >and chosen model.</text><text x="671" y="346" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Apply request budgets.</text><path d="M894 300H930" fill="none" stroke="#f0ba96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#peach-arrow)" stroke-dasharray="7 7"/><rect x="943" y="229" width="217" height="145" rx="18" fill="#15242b" stroke="#30454e" /><path d="M944 251V352" fill="none" stroke="#f0ba96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="965" y="265" fill="#f0ba96" font-size="22" font-weight="600" text-anchor="start" >04  Explain</text><text x="965" y="296" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Observed evidence</text><text x="965" y="321" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Possible causes</text><text x="965" y="346" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >Suggested checks</text><rect x="40" y="409" width="1120" height="101" rx="16" fill="#101e24" stroke="#30454e" /><text x="64" y="446" fill="#79dfc5" font-size="23" font-weight="600" text-anchor="start" >Critical alerts do not wait for AI.</text><text x="64" y="480" fill="#a8bac1" font-size="20" font-weight="400" text-anchor="start" >The model cannot execute commands, change settings or repair the server.</text><text x="40" y="554" fill="#a8bac1" font-size="18" font-weight="400" text-anchor="start" >BYOK = bring your own API key. Provider availability and charges are separate.</text>
</g></svg>
